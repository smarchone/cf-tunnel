# Online: docker compose up -d
# AFK:    ./scripts/down.sh
services:
  cloudflared:
    image: cloudflare/cloudflared:2026.11.1
    # Quick tunnel (no account/domain). Metrics port is reachable only inside this compose network.
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 --url http://nginx:8080
    depends_on: [nginx]
    restart: unless-stopped

  registrar:
    image: curlimages/curl:8.11.1
    # Watches cloudflared's quick-tunnel URL; tells the Worker whenever it changes.
    entrypoint: ["/bin/sh", "/register.sh"]
    environment:
      WORKER_URL: ${WORKER_URL:?run scripts/deploy-worker.sh first}
      REGISTER_KEY: ${REGISTER_KEY:?run scripts/init-env.sh first}
    volumes:
      - ./registrar/register.sh:/register.sh:ro
    depends_on: [cloudflared]
    read_only: true
    restart: unless-stopped

  nginx:
    image: nginxinc/nginx-unprivileged:alpine   # non-root, listens on 8080
    environment:
      ORIGIN_KEY: ${ORIGIN_KEY:?run scripts/init-env.sh first}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro   # rendered with ORIGIN_KEY at start
    read_only: true
    tmpfs:
      - /tmp
      - /etc/nginx/conf.d:uid=101,gid=101
    restart: unless-stopped
    # no "ports:" — only cloudflared can reach nginx
