# Started and stopped by ./scripts/online.sh (via cf-tunnel start/stop). Don't run it by hand.
services:
  cloudflared:
    image: cloudflare/cloudflared:2026.11.1
    # Quick tunnel (no account/domain).
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 --url http://nginx:8080
    # Metrics on the Mac's loopback only, for scripts/online.sh to read the URL.
    ports: ["127.0.0.1:2000:2000"]
    depends_on: [nginx]
    restart: on-failure   # online.sh owns the lifecycle; don't revive at Docker start

  nginx:
    image: nginxinc/nginx-unprivileged:alpine   # non-root, listens on 8080
    environment:
      ORIGIN_KEY: ${ORIGIN_KEY:?run scripts/init-env.sh first}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro   # rendered with ORIGIN_KEY at start
    read_only: true
    tmpfs:
      - /tmp
      - /etc/nginx/conf.d:uid=101,gid=101
    restart: on-failure   # online.sh owns the lifecycle; don't revive at Docker start
    # no "ports:" — only cloudflared can reach nginx
